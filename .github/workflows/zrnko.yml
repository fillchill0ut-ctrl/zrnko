# Zrnko: každé ráno vytvoří 2 nové lekce a zveřejní aplikaci na GitHub Pages.
# Spouští se: denně v 5:13 UTC (7:13 letního / 6:13 zimního času v Praze),
# ručně tlačítkem "Run workflow" a po každém nahrání změn do repozitáře.
name: Zrnko – nové lekce a zveřejnění

on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zrnko
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vytvořit nové lekce
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZRNKO_PER_DAY: "2"
        run: node scripts/generate.mjs

      - name: Uložit nové lekce do repozitáře
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- daily.json; then echo "Žádné změny."; exit 0; fi
          git config user.name "zrnko-bot"
          git config user.email "zrnko-bot@users.noreply.github.com"
          git add daily.json
          git commit -m "Nová zrnka $(TZ=Europe/Prague date +%F)"
          git push

      - name: Připravit stránku
        run: |
          mkdir -p _site
          cp index.html lessons.js art.js daily.json manifest.json sw.js *.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
